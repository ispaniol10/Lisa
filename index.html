<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisas Lernseiten</title>
<style>
  :root{
    --bg:#f7f4ec; --card:#ffffff; --text:#2b2b33; --muted:#6b6b78; --line:#e4dfd2;
    --shadow:0 2px 10px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171c; --card:#1f232b; --text:#eceef2; --muted:#a3a8b4; --line:#2e333d;
      --shadow:0 2px 10px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171c; --card:#1f232b; --text:#eceef2; --muted:#a3a8b4; --line:#2e333d;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:32px 16px 48px}
  header{text-align:center;margin-bottom:28px}
  h1{font-size:2.1rem;margin:0 0 6px}
  header p{margin:0;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .subj{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
        border:1px solid var(--line);display:flex;flex-direction:column}
  .subj-head{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#fff;background:var(--c)}
  .subj-head .ico{font-size:1.8rem;line-height:1}
  .subj-head h2{margin:0;font-size:1.25rem}
  .subj-head .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:999px;
                  padding:2px 10px;font-size:.85rem;font-weight:700}
  ul{list-style:none;margin:0;padding:8px}
  li a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
       color:var(--text);text-decoration:none;font-weight:600}
  li a:hover,li a:focus-visible{background:color-mix(in srgb,var(--c) 14%,transparent);outline:none}
  li a::before{content:"▸";color:var(--c);font-size:1.1rem}
  .empty{padding:16px 20px;color:var(--muted);font-style:italic}
  .note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Lisas Lernseiten</h1>
    <p>Wähle ein Fach und eine Übung aus.</p>
  </header>
  <main class="grid" id="grid"></main>
  <p class="note" id="note"></p>
</div>

<script>
// Fächer = Unterordner im Repository
const SUBJECTS = [
  {dir:'Deutsch',     ico:'✏️', c:'#d6495a'},
  {dir:'Mathe',       ico:'➗', c:'#2f6fd0'},
  {dir:'Französisch', ico:'🥐', c:'#3a4fb0'},
  {dir:'Erdkunde',    ico:'🌍', c:'#2e8b57'},
  {dir:'Nawi',        ico:'🔬', c:'#0f8c8c'},
  {dir:'Musik',       ico:'🎹', c:'#8a4fc4'},
  {dir:'Religion',    ico:'🕊️', c:'#c9821f'},
];
// Ersatzliste, falls GitHub gerade nicht erreichbar ist
const FALLBACK = {
  'Deutsch':['nomen-training.html','brief-anrede-uebung.html'],
  'Musik':['klavier-tastatur.html'],
};
const REPO = 'ispaniol10/Lisa', BRANCH = 'main';

const grid = document.getElementById('grid');
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const pretty = f => f.replace(/\.html?$/i,'').replace(/[-_]+/g,' ')
  .replace(/(^|\s)(\p{L})/gu, (m,a,b)=>a+b.toUpperCase());

function render(files){
  grid.innerHTML = '';
  SUBJECTS.forEach(s=>{
    const list = (files[s.dir]||[]).slice().sort((a,b)=>a.localeCompare(b,'de'));
    const card = document.createElement('section');
    card.className = 'subj'; card.style.setProperty('--c', s.c);
    card.innerHTML = `<div class="subj-head"><span class="ico">${s.ico}</span><h2>${s.dir}</h2>
      <span class="cnt">${list.length}</span></div>`;
    if(!list.length){
      card.insertAdjacentHTML('beforeend','<div class="empty">Noch keine Übungen.</div>');
    } else {
      const ul = document.createElement('ul');
      list.forEach(f=>{
        const href = enc(s.dir+'/'+f);
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = href; a.textContent = pretty(f);
        li.appendChild(a); ul.appendChild(li);
        // echten Seitentitel nachladen (gleiche Domain)
        fetch(href).then(r=>r.ok?r.text():null).then(t=>{
          const m = t && t.match(/<title[^>]*>([^<]+)<\/title>/i);
          if(m) a.textContent = m[1].trim();
        }).catch(()=>{});
      });
      card.appendChild(ul);
    }
    grid.appendChild(card);
  });
}

async function load(){
  render(FALLBACK);
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    const files = {};
    data.tree.forEach(n=>{
      if(n.type!=='blob' || !/\.html?$/i.test(n.path)) return;
      const parts = n.path.split('/');
      if(parts.length < 2) return;
      const dir = parts[0];
      (files[dir] = files[dir] || []).push(parts.slice(1).join('/'));
    });
    render(files);
  }catch(e){
    document.getElementById('note').textContent =
      'Hinweis: Die Liste konnte gerade nicht aktualisiert werden – es werden die bekannten Übungen angezeigt.';
  }
}
load();
</script>
</body>
</html>
