<title>Schreibwerkstatt Paris</title>

<style>
/* Layout: Kopfzeile oben, darunter Spielkarte (Hero mit Stadt-Panorama + Kacheln) oder ein Spiel im Panel */
:root{--bg:#E6F1FA;--surface:#FFFFFF;--surface2:#F1F7FC;--ink:#1B2A4A;--muted:#566887;--line:#C9DAEA;--sun:#FFC93C;--sun-ink:#2E2200;--red:#E8454D;--teal:#12887B;--blue:#2457D6;--good:#17804A;--bad:#C93640;--art:#EAF4FB;--hero1:#BFE3F5;--hero2:#E6F1FA;--shadow:0 5px 0 rgba(27,42,74,.10);--disp:"Baloo 2","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}

:root[data-theme="dark"]{--bg:#0E1526;--surface:#18223B;--surface2:#212D4D;--ink:#EEF3FF;--muted:#A3B3D6;--line:#2F3E66;--red:#FF7C83;--teal:#45D3C0;--blue:#7BA5FF;--good:#4BD890;--bad:#FF7C83;--hero1:#1E3263;--hero2:#0E1526;--shadow:0 5px 0 rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 0}
.top .logo{font-family:var(--disp);font-weight:800;font-size:1.25rem;letter-spacing:.01em;margin-right:auto}
.top .logo b{color:var(--red)}

.hero h1 span{background:linear-gradient(transparent 62%,var(--sun) 62%)}

.hero-row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hero-row>div{min-width:0;flex:1 1 260px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;max-width:260px}
.pipo{display:flex;align-items:flex-end;gap:8px}
.pipo svg{width:84px;height:auto;flex:none}
.sky{display:block;width:100%;height:150px;margin-top:14px}
.grp{display:flex;align-items:center;gap:10px;margin:28px 0 12px}

.tile small{color:var(--muted);font-weight:700;padding:0 4px}
.tile .st{padding:0 4px;color:var(--sun);font-size:1.25rem;letter-spacing:2px;text-shadow:0 0 0 var(--ink);-webkit-text-stroke:.6px var(--sun-ink)}

.opt{font:inherit;font-weight:800;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:56px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;flex-direction:column}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{background:color-mix(in srgb,var(--good) 25%,var(--surface));border-color:var(--good)}
.opt.no{background:color-mix(in srgb,var(--bad) 22%,var(--surface));border-color:var(--bad)}
.opts.pic .opt{background:var(--art);padding:6px}
.opts.pic .opt svg{width:100%;height:auto;max-height:110px}

.fb{margin-top:14px;font-weight:800;min-height:1px}
.fb .msg{padding:10px 14px;border-radius:14px;margin-bottom:10px}

.fb .bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.btn{font:inherit;font-weight:800;background:var(--sun);color:var(--sun-ink);border:2px solid var(--sun-ink);border-radius:14px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 var(--sun-ink)}
.btn.alt{background:var(--surface2);color:var(--ink);border-color:var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.spk{font:inherit;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--blue);cursor:pointer;vertical-align:middle;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fcard{perspective:700px;cursor:pointer;min-height:150px;border:0;background:none;padding:0;font:inherit;color:inherit}
.fin{position:relative;height:100%;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.fcard.flipped .fin{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center}
.ff.front{background:var(--art);color:#1B2A4A}

.slots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.slot{min-width:70px;min-height:48px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;padding:0 10px}
.slot.f{border-style:solid}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font:inherit;font-weight:800;border:2px solid var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;color:#1B2A4A;font-size:1.1rem}

.c0{background:#FFD35A}.c1{background:#A9DB87}.c2{background:#FFB27A}.c3{background:#8EC9E8}
.city{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px;background:linear-gradient(var(--art) 85%,#9FB0C8 85%);border-radius:18px;padding:12px 12px 16px}

.bld svg{width:100%;height:auto}
.bld .num{position:absolute;top:2px;left:4px;background:var(--red);color:#fff;font-weight:800;font-size:.8rem;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center}
.bld.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 25%,transparent)}
.sit{font-family:var(--disp);font-size:1.5rem;font-weight:800}
.say-box{background:var(--surface2);border-radius:16px;padding:12px 16px;font-weight:800;display:grid;gap:4px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:640px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mc{font:inherit;min-height:78px;border-radius:14px;border:2px solid var(--ink);background:repeating-linear-gradient(45deg,var(--blue),var(--blue) 8px,var(--surface) 8px,var(--surface) 16px);color:transparent;cursor:pointer;padding:4px;font-weight:800;font-size:.95rem}
.mc.up,.mc.done{color:var(--ink);background:var(--surface2);border-color:var(--line)}
.mc.up.fr,.mc.done.fr{background:color-mix(in srgb,var(--blue) 22%,var(--surface))}
.mc.up.de,.mc.done.de{background:color-mix(in srgb,var(--sun) 40%,var(--surface))}

.chat{display:grid;gap:8px;margin:10px 0}
.msg-b{max-width:88%;padding:8px 14px;border-radius:16px;font-weight:800}
.msg-b small{display:block;font-size:.75rem;opacity:.75}
.msg-b.l{background:color-mix(in srgb,var(--blue) 22%,var(--surface));justify-self:start;border-bottom-left-radius:4px}
.msg-b.r{background:color-mix(in srgb,var(--sun) 45%,var(--surface));justify-self:end;border-bottom-right-radius:4px}
.tip{background:color-mix(in srgb,var(--sun) 28%,var(--surface));border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.big-stars{font-size:3rem;text-align:center}
.res{text-align:center}
.res h2{font-size:2rem}
.res ul{text-align:left;max-width:420px;margin:12px auto;padding-left:20px;font-weight:700}
details{margin-top:30px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
summary{font-family:var(--disp);font-weight:800;font-size:1.2rem;cursor:pointer}
.vl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 20px;margin-top:10px}
.vl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-weight:700}
.vl span{color:var(--muted);text-align:right}
.av{border-radius:50%;display:block}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gs{font:inherit;font-weight:800;border:2px solid var(--line);border-radius:10px;padding:3px 4px;background:var(--surface2);color:var(--ink);max-width:100%}
.gs.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--surface))}
.gs.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--surface))}
.ln{display:flex;gap:8px;align-items:baseline;margin:12px 0;flex-wrap:wrap;line-height:2.2}
.who{font-weight:800;color:var(--muted);min-width:5.4em}
.inp,.ta{width:100%;font:inherit;font-weight:700;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface2);color:var(--ink)}
.ta{min-height:130px;resize:vertical}
.sch{width:100%;height:auto;background:var(--art);border-radius:18px;display:block}
.node{cursor:pointer}
.node.sel .ring{stroke:var(--red);stroke-width:5}
.ring{fill:none;stroke:transparent;stroke-width:4}
.node:hover .ring{stroke:#2F6FED}
.lt{font:inherit;font-weight:800;font-size:1.3rem;min-width:46px;height:50px;border-radius:12px;border:2px solid #1B2A4A;background:#FFD35A;color:#1B2A4A;cursor:pointer}
.lt:disabled{opacity:.25}
.word{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--disp);font-size:1.6rem;font-weight:800;min-height:56px;border-bottom:3px dashed var(--line);margin:10px 0}
.ck{list-style:none;padding:0;margin:10px 0;display:grid;gap:4px;font-weight:700}
.ck li::before{content:"○ ";color:var(--muted)}
.ck li.done::before{content:"✔ ";color:var(--good)}
.hint{color:var(--muted);font-weight:700;font-size:.95rem}
.bub{max-width:90%;padding:10px 14px;border-radius:16px;font-weight:800;margin:6px 0}
.bub.in{background:var(--surface2);border:2px solid var(--line);justify-self:start}
.bub.out{background:color-mix(in srgb,var(--blue) 24%,var(--surface));justify-self:end}
.mapnum{position:absolute;top:2px;right:4px;background:var(--teal);color:#fff;font-weight:800;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:.85rem}
.pick{outline:3px solid var(--red)!important}
</style>

(function(){

];

/* ---------- Quiz-Motor ---------- */
function runQuiz(cfg){
 const qs=cfg.qs;let i=0,score=0,locked=false;const wrong=[];
 function ask(){
  const q=qs[i];locked=false;
  const opts=shuffle(q.opts.map((h,k)=>({h,ok:k===q.a})));
  view(`${bar(cfg.title)}${cfg.header||""}<div class="panel"><div class="pcount">Frage ${i+1} von ${qs.length}</div><div class="prog"><span style="width:${i/qs.length*100}%"></span></div><div class="qbody" style="margin-top:14px">${q.q}</div><div class="opts ${q.cls||""}">${opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${o.h}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>`);
  $$(".opt").forEach(b=>b.onclick=()=>{
   if(locked)return;locked=true;
   const o=opts[+b.dataset.k];
   $$(".opt").forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add("ok")});
   let m;
   if(o.ok){score++;m=`<div class="msg good">${pick(["Richtig!","Très bien !","Genau!","Super!","Bravo !"],1)[0]} ${q.why||""}</div>`}
   else{b.classList.add("no");wrong.push(q);m=`<div class="msg bad">Fast! ${q.why||"Schau dir die richtige Antwort an."}</div>`}
   if(q.say)say(q.say);
   $("#fb").innerHTML=m+`<button class="btn" id="nx">${i+1<qs.length?"Weiter →":"Ergebnis ansehen"}</button>`;
   $("#nx").onclick=()=>{i++;i<qs.length?ask():end()};
   $("#nx").focus();
  });
 }
 function end(){
  const pct=Math.round(score/qs.length*100);
  const st=pct>=90?3:pct>=70?2:pct>=40?1:0;
  result({id:cfg.id,title:cfg.title,st,noAward:cfg.noAward,summary:`${score} von ${qs.length} richtig (${pct} %)`,lines:wrong.map(q=>q.why).filter(Boolean),again:cfg.again,
   retry:wrong.length?()=>runQuiz({...cfg,qs:shuffle(wrong),noAward:true,title:cfg.title+" – Fehler"}):null});
 }
 ask();
}

 const items=cfg.items;let i=0,pts=0;const missed=[];
 function show(){
  const it=items[i];let hint=0,tries=0,fin=false;
  view(`${bar(cfg.title)}<div class="panel">${i===0&&cfg.intro?`<div class="tip">${cfg.intro}</div>`:""}<div class="pcount">Aufgabe ${i+1} von ${items.length}</div><div class="prog"><span style="width:${i/items.length*100}%"></span></div><div style="margin-top:14px">${it.p}</div><input class="inp" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort">${accBar()}<div class="fb" id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="ck">Prüfen</button><button class="btn alt" id="hn">Tipp</button></div></div>`);
  const inp=$("#in");inp.focus();
  if(cfg.auto&&it.say)setTimeout(()=>say(it.say),250);
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#ck").click()}};
  $("#hn").onclick=()=>{if(fin)return;hint++;const a=it.a[0];$("#fb").innerHTML=`<div class="msg good">Tipp: ${a.slice(0,Math.min(hint+1,a.length-1))}…</div>`};
  const next=()=>{i++;i<items.length?show():end()};
  function done(txt,p,good){fin=true;pts+=p;$("#ck").disabled=true;$("#hn").disabled=true;inp.disabled=true;if(it.say)say(it.say);
   $("#fb").innerHTML=`<div class="msg ${good?"good":"bad"}">${txt} <b>${it.a[0]}</b> ${it.say?spk(it.say):""}</div><button class="btn" id="nx">${i+1<items.length?"Weiter →":"Ergebnis"}</button>`;$("#nx").onclick=next;$("#nx").focus()}
  $("#ck").onclick=()=>{
   if(fin||!inp.value.trim())return;
   const v=judge(inp.value,it.a);tries++;
   if(v==="ok")done(tries>1?"Richtig im zweiten Versuch:":hint?"Richtig mit Tipp:":"Richtig!",tries>1||hint?.6:1,true);
   else if(v==="close"){done("Fast! Achte auf die Akzente und Apostrophe:",.7,true)}
   else if(tries<2){$("#fb").innerHTML=`<div class="msg bad">Noch nicht. Schau genau hin und versuch es nochmal. Ein Tipp hilft!</div>`;shake(inp)}
   else{missed.push(it.a[0]);done("Die richtige Schreibweise:",0,false)}
  };
 }
 function end(){const r=pts/items.length;result({id:cfg.id,title:cfg.title,st:r>=.85?3:r>=.6?2:1,summary:`${Math.round(pts*10)/10} von ${items.length} Punkten.`,lines:missed,again:cfg.again})}
 show();
}

/* ---------- Wörter schreiben ---------- */
function gPicWrite(){
 typeGame({id:"picwrite",title:"Bild-Diktat",again:gPicWrite,intro:"Schreibe das französische Wort mit Artikel unter das Bild, zum Beispiel <i>le café</i>.",
  items:shuffle(PLACES).map(p=>({p:`<div class="qart">${art(p.id,"",false)}</div><p class="ask">Was ist das? Schreibe es mit Artikel.</p>`,a:[p.fr],say:p.fr}))});
}
function gDeFr(){
 function start(){
  view(`${bar("Deutsch → Französisch")}<div class="panel"><p class="ask">Tippe die französischen Wörter und Sätze ein.</p><p class="tip">Im großen Test sind <b>alle ${WPOOL.length}</b> Wörter dabei, die man ohne Platzhalter schreiben kann.</p><div class="row"><button class="btn" data-m="q">Schnelle Runde (10)</button><button class="btn" data-m="all">Großer Test (alle ${WPOOL.length})</button></div></div>`);
  $$("[data-m]").forEach(b=>b.onclick=()=>go(b.dataset.m));
 }
 function go(m){
  const src=m==="all"?shuffle(WPOOL):pick(WPOOL,10);
  typeGame({id:"defr",title:"Deutsch → Französisch",again:start,items:src.map(x=>({p:`<p class="ask">Wie heißt das auf Französisch?</p><p class="ask big">${x.de}</p>`,a:[x.fr],say:x.fr}))});
 }
 start();
}
function gBlitz(){
 const pool=shuffle(WPOOL);let k=0,ok=0,t=60;const miss=[];
 clearInterval(tm);
 view(`${bar("Blitzrunde")}<div class="panel"><div class="tip">60 Sekunden! Schreibe so viele Wörter wie möglich. Drücke nach jedem Wort die Eingabetaste. Akzente dürfen beim Blitzen fehlen.</div><div class="row" style="align-items:center"><span class="pill" id="tl">60 s</span><span class="pill" id="sc">0 richtig</span></div><p class="ask big" id="pr" style="margin-top:14px"></p><input class="inp" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Deine Antwort">${accBar()}<div class="fb" id="fb"></div></div>`);
 const inp=$("#in");
 const show=()=>{$("#pr").textContent=pool[k%pool.length].de;inp.value=""};
 show();inp.focus();
 inp.onkeydown=e=>{if(e.key!=="Enter")return;e.preventDefault();const it=pool[k%pool.length];
  if(!inp.value.trim())return;
  if(judge(inp.value,[it.fr])!=="no"){ok++;$("#sc").textContent=ok+" richtig";$("#fb").innerHTML=`<div class="msg good">✔ ${it.fr}</div>`}
  else{miss.push(it.fr+" = "+it.de);$("#fb").innerHTML=`<div class="msg bad">${it.fr}</div>`;shake(inp)}
  k++;show()};
 tm=setInterval(()=>{t--;const e=$("#tl");if(!e){clearInterval(tm);return}e.textContent=t+" s";
  if(t<=0){clearInterval(tm);result({id:"blitz",title:"Blitzrunde",st:ok>=12?3:ok>=8?2:1,summary:`${ok} Wörter in 60 Sekunden richtig.`,lines:miss.slice(-5),again:gBlitz})}},1000);
}

const DIAL=[
 {t:"Kennenlernen",l:[["Gabin","Salut !"],["Noé","Salut ! Tu {{t'appelles}} comment ?"],["Gabin","Je {{m'appelle}} Gabin. Et {{toi}} ?"],["Noé","{{Moi}}, c'est Noé."]]},
 {t:"Freunde vorstellen",l:[["Noé","C'est {{qui}} ?"],["Gabin","C'est mon {{ami}} Idriss. Et la fille, c'est {{mon}} amie Jeanne."],["Noé","Ah, {{d'accord}} !"],["Idriss","{{Bienvenue}} dans le quartier, Noé !"],["Noé","J'{{habite}} ici {{depuis}} samedi."]]},
 {t:"Nach dem Weg fragen",l:[["Léo","Pardon, Madame, où est {{la tour}} ?"],["Madame","C'est {{là}}."],["Léo","{{Merci}} ! Pardon, Monsieur, où est {{le métro}} ?"],["Monsieur","Le métro ? C'est {{là}}."],["Léo","{{Merci}} !"]]},
 {t:"Mehrzahl",l:[["Noé","Salut, les {{garçons}} !"],["Jeanne","Salut Noé ! Les {{filles}} avec les {{chiens}}, c'est qui ?"],["Gabin","Ce {{sont}} Animata et Fanta, les {{amies}} de Dalia."]]}];
function gDialType(){
 let d=0,sumOk=0,sumAll=0;
 function show(){
  const D=DIAL[d];let first=null;
  const render=t=>t.replace(/\{\{([^}]*)\}\}/g,(m,a)=>`<input class="gi inp" style="width:${Math.max(6,a.length+3)}ch;display:inline-block;padding:4px 8px" data-a="${a.replace(/"/g,"&quot;")}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Lücke">`);
  view(`${bar("Lückendialoge zum Schreiben")}<div class="panel"><div class="pcount">Dialog ${d+1} von ${DIAL.length}: ${D.t}</div><div class="prog"><span style="width:${d/DIAL.length*100}%"></span></div>${accBar()}${D.l.map(l=>`<div class="ln"><span class="who">${l[0]}</span><span>${render(l[1])}</span></div>`).join("")}<div class="fb" id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="ck">Prüfen</button></div></div>`);
  const first_=$(".gi");if(first_)first_.focus();
  $("#ck").onclick=()=>{
   const gs=$$(".gi");let ok=0;
   gs.forEach(g=>{const v=judge(g.value||"§",[g.dataset.a]);const r=v==="ok";if(r)ok++;g.style.borderColor=r?"var(--good)":v==="close"?"var(--sun)":"var(--bad)"});
   if(first===null){first=ok;sumOk+=ok;sumAll+=gs.length}
   if(ok===gs.length){say(D.l.map(l=>l[1].replace(/\{\{|\}\}/g,"")).join(" "));$("#fb").innerHTML=`<div class="msg good">Alle ${ok} Lücken stimmen! ${spk(D.l.map(l=>l[1].replace(/\{\{|\}\}/g,"")).join(" "))}</div><button class="btn" id="nx">${d+1<DIAL.length?"Nächster Dialog →":"Ergebnis"}</button>`;
    $("#nx").onclick=()=>{d++;d<DIAL.length?show():result({id:"dialtype",title:"Lückendialoge zum Schreiben",st:sumOk/sumAll>=.85?3:sumOk/sumAll>=.6?2:1,summary:`Beim ersten Prüfen ${sumOk} von ${sumAll} Lücken richtig.`,again:gDialType})}}
   else $("#fb").innerHTML=`<div class="msg bad">${ok} von ${gs.length} Lücken stimmen. Gelb heißt: fast, prüfe Akzente und Apostroph.</div>`;
  };
 }
 show();
}
function gTransWrite(){
 const S=[["Wie heißt du?",["Tu t'appelles comment ?","Comment tu t'appelles ?"]],["Ich heiße Lisa.",["Je m'appelle Lisa."]],["Das ist meine Freundin.",["C'est mon amie."]],["Wer ist das?",["C'est qui ?"]],["Das sind die Jungen.",["Ce sont les garçons."]],["Entschuldigung, wo ist das Kino?",["Pardon, où est le cinéma ?"]],["Er heißt Noé.",["Il s'appelle Noé."]],["Sie wohnt seit Samstag hier.",["Elle habite ici depuis samedi."]],["Das ist der Hund von Madame Ménard.",["C'est le chien de Madame Ménard."]],["Ich weiß es nicht.",["Je ne sais pas."]],["Willkommen im Viertel!",["Bienvenue dans le quartier !"]],["Das ist mein Freund.",["C'est mon ami."]]];
 typeGame({id:"transwrite",title:"Sätze übersetzen",again:gTransWrite,intro:"Übersetze die Sätze ins Französische. Groß- und Kleinschreibung sowie Satzzeichen sind egal, Akzente zählen.",
  items:pick(S,8).map(([de,a])=>({p:`<p class="ask">Wie sagt man das auf Französisch?</p><p class="ask big">${de}</p>`,a,say:a[0]}))});
}
function gPluWrite(){
 typeGame({id:"pluwrite",title:"Mehrzahl schreiben",again:gPluWrite,intro:"Schreibe die Mehrzahl mit <i>les</i> und <b>-s</b>, zum Beispiel <i>la fille → les filles</i>.",
  items:pick(NOUNS,10).map(n=>{const s=n.art+(n.art==="l'"?"":" ")+n.noun,pl="les "+n.noun+"s";return {p:`<p class="ask">Mach die Mehrzahl!</p><p class="ask big">${s} → ?</p>`,a:[pl],say:pl}})});

function gDict2(){
 const S=["Pardon Madame, où est la poste ?","Le garçon avec le chien, c'est qui ?","Bienvenue dans le quartier !","Je ne sais pas.","C'est l'amie de Jeanne.","Il s'appelle Gabin.","Elle habite ici depuis samedi.","Ce sont les filles de la ville."];

}
