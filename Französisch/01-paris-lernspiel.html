<title>Paris zum Spielen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: Kopfzeile oben, darunter Spielkarte (Hero mit Stadt-Panorama + Kacheln) oder ein Spiel im Panel */
:root{--bg:#E6F1FA;--surface:#FFFFFF;--surface2:#F1F7FC;--ink:#1B2A4A;--muted:#566887;--line:#C9DAEA;--sun:#FFC93C;--sun-ink:#2E2200;--red:#E8454D;--teal:#12887B;--blue:#2457D6;--good:#17804A;--bad:#C93640;--art:#EAF4FB;--hero1:#BFE3F5;--hero2:#E6F1FA;--shadow:0 5px 0 rgba(27,42,74,.10);--disp:"Baloo 2","Nunito",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1526;--surface:#18223B;--surface2:#212D4D;--ink:#EEF3FF;--muted:#A3B3D6;--line:#2F3E66;--red:#FF7C83;--teal:#45D3C0;--blue:#7BA5FF;--good:#4BD890;--bad:#FF7C83;--hero1:#1E3263;--hero2:#0E1526;--shadow:0 5px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1526;--surface:#18223B;--surface2:#212D4D;--ink:#EEF3FF;--muted:#A3B3D6;--line:#2F3E66;--red:#FF7C83;--teal:#45D3C0;--blue:#7BA5FF;--good:#4BD890;--bad:#FF7C83;--hero1:#1E3263;--hero2:#0E1526;--shadow:0 5px 0 rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 0}
.top .logo{font-family:var(--disp);font-weight:800;font-size:1.25rem;letter-spacing:.01em;margin-right:auto}
.top .logo b{color:var(--red)}
.pill{background:var(--sun);color:var(--sun-ink);font-weight:800;border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{font-family:var(--disp);line-height:1.1;margin:0;text-wrap:balance}
.hero{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(var(--hero1),var(--hero2));padding:24px 22px 0;margin-bottom:26px}
.hero h1{font-size:clamp(2.1rem,7vw,3.6rem);font-weight:800}
.hero h1 span{background:linear-gradient(transparent 62%,var(--sun) 62%)}
.hero p{margin:10px 0 0;max-width:34ch;color:var(--muted);font-weight:700}
.hero-row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.hero-row>div{min-width:0;flex:1 1 260px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;max-width:260px}
.pipo{display:flex;align-items:flex-end;gap:8px}
.pipo svg{width:84px;height:auto;flex:none}
.sky{display:block;width:100%;height:150px;margin-top:14px}
.grp{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.grp .tag{background:var(--sun);color:var(--sun-ink);font-family:var(--disp);font-weight:800;border-radius:10px 10px 10px 0;padding:2px 12px}
.grp h2{font-size:1.2rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{font:inherit;color:inherit;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px 10px 14px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile .ic{background:var(--art);border-radius:14px;height:112px;display:grid;place-items:center;overflow:hidden}
.tile .ic svg{height:100px;width:auto;max-width:100%}
.tile h3{font-size:1.15rem;padding:0 4px}
.tile small{color:var(--muted);font-weight:700;padding:0 4px}
.tile .st{padding:0 4px;color:var(--sun);font-size:1.25rem;letter-spacing:2px;text-shadow:0 0 0 var(--ink);-webkit-text-stroke:.6px var(--sun-ink)}
.st{color:var(--sun);-webkit-text-stroke:.6px var(--sun-ink);letter-spacing:2px}
.gbar{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.gbar h2{font-size:1.6rem}
.back{font:inherit;font-weight:800;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.prog{height:12px;border-radius:99px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--teal);transition:width .3s}
.pcount{color:var(--muted);font-weight:800;font-size:.9rem;margin:8px 0 12px}
.qbody{margin-bottom:14px}
.qart{display:grid;place-items:center;background:var(--art);border-radius:18px;padding:10px;margin-bottom:12px}
.qart svg{width:min(210px,60%);height:auto}
.avs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:var(--art);border-radius:18px;padding:10px;margin-bottom:12px;font-size:2rem}
.avs svg{width:84px;height:84px}
.ask{font-size:1.2rem;font-weight:800;margin:6px 0}
.ask.big{font-family:var(--disp);font-size:1.8rem}
.de{color:var(--muted);font-weight:700;font-size:1rem}
.gap{display:inline-block;min-width:3.2ch;border-bottom:3px solid var(--ink);text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{font:inherit;font-weight:800;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:56px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;flex-direction:column}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{background:color-mix(in srgb,var(--good) 25%,var(--surface));border-color:var(--good)}
.opt.no{background:color-mix(in srgb,var(--bad) 22%,var(--surface));border-color:var(--bad)}
.opts.pic .opt{background:var(--art);padding:6px}
.opts.pic .opt svg{width:100%;height:auto;max-height:110px}
.opt .av{width:64px;height:64px}
.fb{margin-top:14px;font-weight:800;min-height:1px}
.fb .msg{padding:10px 14px;border-radius:14px;margin-bottom:10px}
.fb .good{background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.fb .bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.btn{font:inherit;font-weight:800;background:var(--sun);color:var(--sun-ink);border:2px solid var(--sun-ink);border-radius:14px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 var(--sun-ink)}
.btn.alt{background:var(--surface2);color:var(--ink);border-color:var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.spk{font:inherit;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--blue);cursor:pointer;vertical-align:middle;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fcard{perspective:700px;cursor:pointer;min-height:150px;border:0;background:none;padding:0;font:inherit;color:inherit}
.fin{position:relative;height:100%;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.fcard.flipped .fin{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center}
.ff.front{background:var(--art);color:#1B2A4A}
.ff.front svg{width:80%;max-height:120px}
.ff.back{transform:rotateY(180deg);background:var(--sun);color:var(--sun-ink);font-weight:800}
.ff.back b{font-family:var(--disp);font-size:1.25rem}
.fcard.txt .ff.front{background:var(--surface2);color:var(--ink);font-family:var(--disp);font-size:1.15rem;font-weight:800}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.slot{min-width:70px;min-height:48px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800;padding:0 10px}
.slot.f{border-style:solid}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font:inherit;font-weight:800;border:2px solid var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;color:#1B2A4A;font-size:1.1rem}
.chip:disabled{opacity:.3;cursor:default}
.c0{background:#FFD35A}.c1{background:#A9DB87}.c2{background:#FFB27A}.c3{background:#8EC9E8}
.city{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px;background:linear-gradient(var(--art) 85%,#9FB0C8 85%);border-radius:18px;padding:12px 12px 16px}
.bld{position:relative;font:inherit;background:transparent;border:2px solid transparent;border-radius:12px;padding:2px;cursor:pointer}
.bld:hover:not(:disabled){border-color:var(--blue)}
.bld svg{width:100%;height:auto}
.bld .num{position:absolute;top:2px;left:4px;background:var(--red);color:#fff;font-weight:800;font-size:.8rem;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center}
.bld.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 25%,transparent)}
.sit{font-family:var(--disp);font-size:1.5rem;font-weight:800}
.say-box{background:var(--surface2);border-radius:16px;padding:12px 16px;font-weight:800;display:grid;gap:4px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:640px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mc{font:inherit;min-height:78px;border-radius:14px;border:2px solid var(--ink);background:repeating-linear-gradient(45deg,var(--blue),var(--blue) 8px,var(--surface) 8px,var(--surface) 16px);color:transparent;cursor:pointer;padding:4px;font-weight:800;font-size:.95rem}
.mc.up,.mc.done{color:var(--ink);background:var(--surface2);border-color:var(--line)}
.mc.up.fr,.mc.done.fr{background:color-mix(in srgb,var(--blue) 22%,var(--surface))}
.mc.up.de,.mc.done.de{background:color-mix(in srgb,var(--sun) 40%,var(--surface))}
.mc.done{opacity:.55}
.chat{display:grid;gap:8px;margin:10px 0}
.msg-b{max-width:88%;padding:8px 14px;border-radius:16px;font-weight:800}
.msg-b small{display:block;font-size:.75rem;opacity:.75}
.msg-b.l{background:color-mix(in srgb,var(--blue) 22%,var(--surface));justify-self:start;border-bottom-left-radius:4px}
.msg-b.r{background:color-mix(in srgb,var(--sun) 45%,var(--surface));justify-self:end;border-bottom-right-radius:4px}
.tip{background:color-mix(in srgb,var(--sun) 28%,var(--surface));border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:14px}
.big-stars{font-size:3rem;text-align:center}
.res{text-align:center}
.res h2{font-size:2rem}
.res ul{text-align:left;max-width:420px;margin:12px auto;padding-left:20px;font-weight:700}
details{margin-top:30px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
summary{font-family:var(--disp);font-weight:800;font-size:1.2rem;cursor:pointer}
.vl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 20px;margin-top:10px}
.vl div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:5px 0;font-weight:700}
.vl span{color:var(--muted);text-align:right}
.av{border-radius:50%;display:block}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Quiz-Motor ---------- */
function runQuiz(cfg){
 const qs=cfg.qs;let i=0,score=0,locked=false;const wrong=[];
 function ask(){
  const q=qs[i];locked=false;
  const opts=shuffle(q.opts.map((h,k)=>({h,ok:k===q.a})));
  view(`${bar(cfg.title)}${cfg.header||""}<div class="panel"><div class="pcount">Frage ${i+1} von ${qs.length}</div><div class="prog"><span style="width:${i/qs.length*100}%"></span></div><div class="qbody" style="margin-top:14px">${q.q}</div><div class="opts ${q.cls||""}">${opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${o.h}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>`);
  $$(".opt").forEach(b=>b.onclick=()=>{
   if(locked)return;locked=true;
   const o=opts[+b.dataset.k];
   $$(".opt").forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add("ok")});
   let m;
   if(o.ok){score++;m=`<div class="msg good">${pick(["Richtig!","Très bien !","Genau!","Super!","Bravo !"],1)[0]} ${q.why||""}</div>`}
   else{b.classList.add("no");wrong.push(q);m=`<div class="msg bad">Fast! ${q.why||"Schau dir die richtige Antwort an."}</div>`}
   if(q.say)say(q.say);
   $("#fb").innerHTML=m+`<button class="btn" id="nx">${i+1<qs.length?"Weiter →":"Ergebnis ansehen"}</button>`;
   $("#nx").onclick=()=>{i++;i<qs.length?ask():end()};
   $("#nx").focus();
  });
 }
 function end(){
  const pct=Math.round(score/qs.length*100);
  const st=pct>=90?3:pct>=70?2:pct>=40?1:0;
  result({id:cfg.id,title:cfg.title,st,noAward:cfg.noAward,summary:`${score} von ${qs.length} richtig (${pct} %)`,lines:wrong.map(q=>q.why).filter(Boolean),again:cfg.again,
   retry:wrong.length?()=>runQuiz({...cfg,qs:shuffle(wrong),noAward:true,title:cfg.title+" – Fehler"}):null});
 }
 ask();
}

 function missing(){
  const sel=new Set();const miss=PLACES.filter(p=>!p.syl).map(p=>p.id).sort();
  view(`${bar("Silben-Puzzle")}<div class="panel"><p class="ask">Welche Wörter vom Stadtbild kamen im Puzzle <u>nicht</u> vor?</p><p class="de">Wähle alle ${miss.length} fehlenden Wörter aus.</p><div class="opts" id="o" style="margin-top:12px">${PLACES.map(p=>`<button class="opt" type="button" data-id="${p.id}">${p.fr}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div><div class="row"><button class="btn" id="ck">Prüfen</button></div></div>`);
  $$(".opt").forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(sel.has(id)){sel.delete(id);b.style.outline=""}else{sel.add(id);b.style.outline="3px solid var(--blue)"}});
  $("#ck").onclick=()=>{
   const s=[...sel].sort();
   if(s.join()===miss.join()){const st=mist<=3?3:mist<=8?2:1;result({id:"syl",title:"Silben-Puzzle",st,summary:`Fehlende Wörter: ${miss.map(i=>PL[i].fr).join(", ")} – ${mist} Fehlversuche.`,again:gSyl})}
   else{mist++;$("#fb").innerHTML=`<div class="msg bad">Noch nicht ganz. Tipp: Es sind genau ${miss.length} Wörter, die nicht in Stücke zerlegt waren.</div>`}
  };
 }
 word();
}
function gMap(){
 const sit=shuffle(SIT);let i=0,mist=0;
 function next(){
  const [txt,id]=sit[i];const p=PL[id];
  view(`${bar("Pardon, où est … ?")}<div class="panel"><div class="pcount">Situation ${i+1} von ${sit.length}</div><div class="prog"><span style="width:${i/sit.length*100}%"></span></div><p class="sit" style="margin-top:14px">${txt}</p><p class="de">Wohin musst du? Tippe auf den passenden Ort in der Stadt.</p><div class="city">${PLACES.map(q=>`<button class="bld" type="button" data-id="${q.id}"><span class="num">${q.n}</span>${art(q.id,"",false)}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>`);
  $$(".bld").forEach(b=>b.onclick=()=>{
   if(b.dataset.id!==id){mist++;shake(b);$("#fb").innerHTML=`<div class="msg bad">Hmm, das passt nicht. Versuch einen anderen Ort!</div>`;return}
   $$(".bld").forEach(x=>x.disabled=true);b.classList.add("ok");
   const l1=`Pardon Monsieur, où est ${p.fr} ?`,l2=`${cap(p.fr)} ? C'est là.`,l3="Merci !";
   say(l1+" "+l2+" "+l3);
   $("#fb").innerHTML=`<div class="say-box"><span>– ${l1}</span><span>– ${l2}</span><span>– ${l3}</span><span>${spk(l1+" "+l2+" "+l3)}</span></div><div class="row"><button class="btn" id="nx">${i+1<sit.length?"Weiter →":"Fertig"}</button></div>`;
   $("#nx").onclick=()=>{i++;i<sit.length?next():result({id:"map",title:"Pardon, où est … ?",st:mist<=3?3:mist<=8?2:1,summary:`Alle 12 Orte gefunden, ${mist} Fehlversuche.`,again:gMap})};
  });
 }
 next();
}
function gWho(){
 const header=`<div class="panel" style="margin-bottom:14px"><p class="de" style="margin:0 0 6px">Die Personen aus Volet 1:</p><div class="avs" style="margin:0">${WHO.map(k=>`<div style="text-align:center;font-size:.85rem;font-weight:800;font-size:.85rem">${av(k)}${NAME[k]}</div>`).join("")}</div></div>`;
 const qs=WHOQ.map(([s,k])=>({q:`<p class="ask big">${s}</p><p class="ask">Wer ist das?</p>`,opts:[av(k)+NAME[k],...pick(WHO.filter(x=>x!==k),3).map(x=>av(x)+NAME[x])],a:0,say:s,why:`${s} → ${NAME[k]}`}));
 qs.push({q:`<p class="ask">Die Sätze 1–5 beschreiben fünf der sechs Figuren. Wer fehlt?</p>`,opts:[av("noe")+"Noé",av("gabin")+"Gabin",av("jeanne")+"Jeanne",av("cotelette")+"Côtelette"],a:0,why:"Noé fehlt. Satz 6 könnte lauten: « C'est Noé. Il habite ici depuis samedi. »",say:"C'est Noé. Il habite ici depuis samedi."});
 runQuiz({id:"who",title:"Qui est-ce ?",qs,header,again:gWho});
}

function gMemory(){
 function start(){
  view(`${bar("Memory")}<div class="panel"><p class="ask">Finde die Paare: Französisch ↔ Deutsch.</p><p class="tip">Blaue Karten sind Französisch, gelbe Deutsch. Mit 3 Sternen belohnt wird, wer wenig daneben tippt.</p><div class="row"><button class="btn" data-m="places">La ville (${PLACES.length} Paare)</button><button class="btn" data-m="words">Wörter & Sätze (${PHRASES.length} Paare)</button></div></div>`);
  $$("[data-m]").forEach(b=>b.onclick=()=>play(b.dataset.m));
 }
 function play(mode){
  const src=mode==="places"?PLACES.map(p=>({fr:p.fr,de:p.de})):PHRASES.map(p=>({fr:p[0],de:p[1]}));
  const sh=shuffle(src);const rounds=[];for(let i=0;i<sh.length;i+=6)rounds.push(sh.slice(i,i+6));
  let r=0,mist=0;
  function round(){
   const pairs=rounds[r];
   const cards=shuffle(pairs.flatMap((p,i)=>[{id:i,t:p.fr,l:"fr"},{id:i,t:p.de,l:"de"}]));
   let first=null,lock=false,done=0;
   view(`${bar("Memory")}<div class="panel"><div class="pcount">Runde ${r+1} von ${rounds.length}</div><div class="prog"><span style="width:${r/rounds.length*100}%"></span></div><div class="mgrid" style="margin-top:14px">${cards.map((c,k)=>`<button class="mc ${c.l}" type="button" data-k="${k}" aria-label="Karte ${k+1}">${c.t}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>`);
   const els=$$(".mc");
   els.forEach((el,k)=>el.onclick=()=>{
    if(lock||el.classList.contains("up")||el.classList.contains("done"))return;
    el.classList.add("up");const c=cards[k];if(c.l==="fr")say(c.t);
    if(!first){first={el,c};return}
    const a=first;first=null;
    if(a.c.id===c.id&&a.c.l!==c.l){a.el.classList.replace("up","done");el.classList.replace("up","done");done++;
     if(done===pairs.length){$("#fb").innerHTML=`<div class="msg good">Alle Paare gefunden!</div><button class="btn" id="nx">${r+1<rounds.length?"Nächste Runde →":"Ergebnis ansehen"}</button>`;$("#nx").onclick=()=>{r++;r<rounds.length?round():fin()}}}
    else{mist++;lock=true;setTimeout(()=>{a.el.classList.remove("up");el.classList.remove("up");lock=false},900)}
   });
  }
  function fin(){const avg=mist/rounds.length;let st=avg<=5?3:avg<=8?2:1;if(mode==="places")st=Math.min(st,1);
   result({id:"memory",title:"Memory",st,summary:`${mist} Fehlversuche in ${rounds.length} Runden.`+(mode==="places"?" Für mehr Sterne spiele „Wörter & Sätze“.":""),again:gMemory})}
  round();
 }
 start();
}
function gTrans(){
 function start(){
  view(`${bar("Übersetzer-Duell")}<div class="panel"><p class="ask">Französisch → Deutsch und Deutsch → Französisch.</p><p class="tip">Im großen Test kommen <b>alle ${POOL.length} Vokabeln</b> der Lektion dran.</p><div class="row"><button class="btn" data-m="q">Schnelle Runde (12)</button><button class="btn" data-m="all">Großer Test (alle ${POOL.length})</button></div></div>`);
  $$("[data-m]").forEach(b=>b.onclick=()=>go(b.dataset.m));
 }
 function go(m){
  const items=m==="all"?shuffle(POOL):pick(POOL,12);
  const qs=items.map(it=>qTrans(it,Math.random()<.5?"fd":"df"));
  runQuiz({id:"trans",title:"Übersetzer-Duell",qs,again:start});
 }
 start();
}
function gDlg(){
 let mist=0;
 const order=shuffle(DLG.map((d,i)=>({who:d[0],t:d[1],i})));
 let nx=0;
 function draw(){
  const built=DLG.slice(0,nx);
  view(`${bar("Dialog-Baukasten")}<div class="panel"><p class="ask">Gabin trifft Noé. Bringe das Gespräch in die richtige Reihenfolge.</p><p class="de">Tippe immer die Zeile an, die als Nächstes gesagt wird.</p><div class="chat">${built.map(d=>`<div class="msg-b ${d[0]==="Noé"?"r":"l"}"><small>${d[0]}</small>${d[1]}</div>`).join("")}</div><div class="opts" id="o">${order.filter(o=>o.i>=nx).map(o=>`<button class="opt" type="button" data-i="${o.i}"><small class="de">${o.who}</small>${o.t}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></div>`);
  $$("#o .opt").forEach(b=>b.onclick=()=>{
   if(+b.dataset.i===nx){say(DLG[nx][1]);nx++;if(nx===DLG.length)fin();else draw()}
   else{mist++;shake(b)}
  });
 }
 function fin(){
  const st=mist<=2?3:mist<=5?2:1;award("dlg",st);updPill();confetti();
  view(`${bar("Dialog-Baukasten")}<div class="panel"><div class="chat">${DLG.map(d=>`<div class="msg-b ${d[0]==="Noé"?"r":"l"}"><small>${d[0]}</small>${d[1]}</div>`).join("")}</div><div class="row">${spk(DLG.map(d=>d[1]).join(" "))}<span class="de" style="align-self:center">Ganzen Dialog anhören</span></div><p class="big-stars st">${stars(st)}</p><p class="tip">Mini-tâche: Schreibe jetzt einen eigenen Dialog. Zwei Kinder treffen sich auf dem Schulhof, fragen nach dem Namen, ein drittes Kind kommt dazu, am Ende fragt ihr „Ça va ?“. Spielt ihn mit jemandem vor!</p><div class="row"><button class="btn" id="again">Nochmal</button><button class="btn alt" data-act="home">Zur Spielkarte</button></div></div>`);
  $("#again").onclick=gDlg;
 }
 draw();
}
const ARTICLE_TIP=`<div class="tip"><b>Merke:</b> le = männlich, la = weiblich, l' vor Vokal oder stummem h, les = Mehrzahl. Aussprache: <i>le</i> klingt wie „lö“, <i>les</i> wie „lee“.</div>`;
function gArt(){runQuiz({id:"art",title:"le, la, l' ou les ?",qs:pick(NOUNS,14).map(qArticle),header:ARTICLE_TIP,again:gArt})}
function gPlu(){
 const ns=pick(NOUNS,12);
 const qs=ns.map((n,i)=>i%3===2?qNumber(n):qPlural(n));
 runQuiz({id:"plu",title:"Ein oder mehrere ?",qs,header:`<div class="tip"><b>Merke:</b> Aus <i>le / la / l'</i> wird <i>les</i>, und hinten kommt meist ein <b>-s</b> dazu (gesprochen wird es nicht!). Beispiel: la fille → les filles.</div>`,again:gPlu});
}
function gCest(){
 const qs=shuffle(pick(CEST,9).map(qCest).concat(pick(MON,4).map(qMon)));
 runQuiz({id:"cest",title:"C'est ou ce sont ?",qs,header:`<div class="tip"><b>Merke:</b> Eine Person oder ein Ding: <i>c'est</i>. Mehrere: <i>ce sont</i>.</div>`,again:gCest});
}
function gFinal(){
 const q=[];
 pick(PLACES,5).forEach((p,i)=>q.push(i%2?qPlaceWord(p):qPlacePic(p)));
 pick(POOL,6).forEach((it,i)=>q.push(qTrans(it,i%2?"fd":"df")));
 pick(NOUNS,3).forEach(n=>q.push(qArticle(n)));
 pick(NOUNS,2).forEach(n=>q.push(qPlural(n)));
 pick(NOUNS,1).forEach(n=>q.push(qNumber(n)));
 pick(CEST,2).forEach(c=>q.push(qCest(c)));
 pick(MON,1).forEach(m=>q.push(qMon(m)));
 runQuiz({id:"final",title:"Le grand défi",qs:shuffle(q),again:gFinal});
}
